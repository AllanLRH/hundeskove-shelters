<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hundeskove — sleeping out with a dog</title>
    <script>
      /* Deliberately a classic inline script, not a module: Vite bundles inline
         modules into the deferred main chunk, which runs after first paint and
         flashes white at dark-mode users. The storage key is asserted to match
         theme.ts in ui/scripts/verify.ts. */
      try {
        var t = localStorage.getItem("hundeskove:theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* private browsing can throw; the media query still handles it */
      }
    </script>
  </head>
  <body>
    <header>
      <div class="header-top">
        <h1>Sleeping out with a dog</h1>
        <button id="theme-toggle" type="button">◐ Auto</button>
      </div>
      <p id="status">Loading…</p>
      <nav class="tabs">
        <button id="tab-list" class="active">List</button>
        <button id="tab-calendar">Calendar</button>
        <button id="tab-map">Map</button>
      </nav>
    </header>
    <main>
      <aside id="panel"></aside>
      <div class="views">
        <div id="view-list" class="view"></div>
        <div id="view-calendar" class="view" hidden></div>
        <div id="view-map" class="view" hidden>
          <div class="map-toolbar">
            <button id="map-home" type="button">Copenhagen</button>
            <button id="map-fit" type="button">Fit to results</button>
          </div>
          <div id="map-canvas"></div>
          <div id="map-detail"></div>
        </div>
      </div>
    </main>
    <footer>
      Facilities and dog forests from
      <a href="https://udinaturen.dk" rel="noreferrer">udinaturen.dk</a> / GeoFA-FKG.
      Map tiles and gap-filled boundaries ©
      <a href="https://www.openstreetmap.org/copyright" rel="noreferrer">OpenStreetMap</a>
      contributors (ODbL). Driving times from
      <a href="https://nominatim.openstreetmap.org" rel="noreferrer">Nominatim</a>
      and <a href="https://project-osrm.org" rel="noreferrer">OSRM</a>, both
      OpenStreetMap-based public services.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
